name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vidpool-frontend
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vidpool-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vidpool-backend
    env:
      VIDPOOL_DATA_DIR: .tmp/test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: alembic current
