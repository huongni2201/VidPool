[package]
name = "vidpool-desktop"
version = "0.1.0"
description = "VidPool Desktop Shell"
authors = ["VidPool Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vidpool_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
rand = "0.8"
ureq = { version = "2", default-features = false }
